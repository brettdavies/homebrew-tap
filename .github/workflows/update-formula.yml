# Lands a prebuilt formula's version bump on `main` and tells the source
# repository to finalize its release, with no pull request.
#
# `bump` verifies each archive the release published against its attestation,
# pins the new checksums, and uploads the bumped formula. `lint` and the four
# `test` legs check that file as `tests.yml` checks a pull request, and `land`
# commits it to `main` only when every one of them passed.
name: Update Formula
run-name: >-
  Update ${{ github.event.client_payload.formula || inputs.formula }}
  to v${{ github.event.client_payload.version || inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name (e.g., xurl-rs)"
        required: true
      version:
        description: "Version without v prefix (e.g., 1.0.4)"
        required: true
      repo:
        description: "GitHub repo (e.g., brettdavies/xurl-rs)"
        required: true
      dry_run:
        description: "Rehearse: run every job, and skip only the push to main and the finalize-release dispatch. A run without it must use the main branch."
        type: boolean
        default: false

permissions: {}

env:
  FORMULA: ${{ github.event.client_payload.formula || inputs.formula }}
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  REPO: ${{ github.event.client_payload.repo || inputs.repo }}
  DRY_RUN: ${{ inputs.dry_run || false }}
  # The run's own commit, so an annotation's link reaches the heading of the
  # workflow that wrote it, on a branch run as on `main`.
  DOCS: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/RELEASES.md

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # No Homebrew here: `lint` and every `test` leg audit the bumped formula,
    # and setting Homebrew up would hold both back by about 50 seconds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          rerun="gh workflow run update-formula.yml --repo ${GITHUB_REPOSITORY}"
          # 1. Formula allowlist (primary security gate)
          if [[ ! "$FORMULA" =~ ^(xurl-rs|bird|agentnative)$ ]]; then
            echo "::error title=invalid-input::formula '${FORMULA}' is not one this tap bumps: xurl-rs, bird, or agentnative. Nothing was pushed. Dispatch again with the formula's name: ${rerun} -f formula=<formula> -f version=${VERSION} -f repo=${REPO}. See ${DOCS}#invalid-input"
            exit 1
          fi

          # 2. Version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            want="${VERSION#v}"
            [[ "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || want="<X.Y.Z>"
            echo "::error title=invalid-input::version '${VERSION}' is not X.Y.Z without a v. Nothing was pushed. Dispatch again with the release's version: ${rerun} -f formula=${FORMULA} -f version=${want} -f repo=${REPO}. See ${DOCS}#invalid-input"
            exit 1
          fi

          # 3. Repo regex (reject path traversal and special characters)
          if [[ ! "$REPO" =~ ^brettdavies/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error title=invalid-input::repo '${REPO}' is not brettdavies/<name>. Nothing was pushed. Dispatch again with the source repo: ${rerun} -f formula=${FORMULA} -f version=${VERSION} -f repo=brettdavies/<name>. See ${DOCS}#invalid-input"
            exit 1
          fi

          # 4. Formula file exists (defense-in-depth)
          if [[ ! -f "Formula/${FORMULA}.rb" ]]; then
            echo "::error title=invalid-input::Formula/${FORMULA}.rb is not in this tap at ${GITHUB_SHA}. Nothing was pushed. Add the formula through a pull request to dev first. See ${DOCS}#invalid-input"
            exit 1
          fi

          # 5. The repo the formula installs from. `land` dispatches
          # finalize-release to REPO, which is safe only when it is that repo.
          source_repo=$(sed -nE 's#^ *url "https://github\.com/([^/]+/[^/]+)/(archive|releases/download)/.*#\1#p' \
            "Formula/${FORMULA}.rb" | sort -u | paste -sd ' ' -)
          if [ "$source_repo" != "$REPO" ]; then
            echo "::error title=repo-mismatch::Formula/${FORMULA}.rb installs from ${source_repo:-no GitHub url}, and this run was given repo ${REPO}. Nothing was pushed. Dispatch with the formula's repo: ${rerun} -f formula=${FORMULA} -f version=${VERSION} -f repo=${source_repo:-<owner/repo>}. See ${DOCS}#repo-mismatch"
            exit 1
          fi

          # A run's checkout is the branch it ran from, and git-try-push
          # pushes local `main`, which it creates from `origin/main`. A run
          # from another branch would push nothing, report success, and
          # finalize the source release with the formula unchanged.
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=push-from-branch::A run that pushes runs from main, and this run is on ${GITHUB_REF_NAME}. Nothing was pushed. To land the bump, run from main: ${rerun} -f formula=${FORMULA} -f version=${VERSION} -f repo=${REPO}. To rehearse on this ref: ${rerun} --ref ${GITHUB_REF_NAME} -f formula=${FORMULA} -f version=${VERSION} -f repo=${REPO} -f dry_run=true. See ${DOCS}#push-from-branch"
            exit 1
          fi

      # A source-built formula needs bottles, and the tap builds none.
      - name: Refuse a source-built formula
        run: |
          FORM=$(scripts/formula-form.sh "Formula/${FORMULA}.rb")
          if [ "$FORM" != prebuilt ]; then
            echo "::error title=source-built-formula::Formula/${FORMULA}.rb builds its tagged source tarball, and this workflow lands only a formula that installs the prebuilt archives its release publishes. Nothing was pushed. Convert the formula to the prebuilt form, then run: gh workflow run update-formula.yml --repo ${GITHUB_REPOSITORY} -f formula=${FORMULA} -f version=${VERSION} -f repo=${REPO}. See ${DOCS}#source-built-formula"
            exit 1
          fi

      # Each archive the formula names is checked against the attestation the
      # source repo's release made for it, and only then is its checksum
      # computed, from the verified file. A release without an attestation
      # stops the bump here.
      - name: Verify release archives and compute SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          # The reusable workflow the source repos release through signs the
          # archives, so it is the signer and not the source repo's own
          # release.yml.
          SIGNER: brettdavies/.github/.github/workflows/rust-release.yml
        run: |
          set -euo pipefail
          F="Formula/${FORMULA}.rb"
          mapfile -t assets < <(sed -nE \
            's#^ *url "https://github\.com/[^/]+/[^/]+/releases/download/v[^/]+/([^"]+)"#\1#p' "$F")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::${F} names no release archive"
            exit 1
          fi
          dir="${RUNNER_TEMP}/archives"
          mkdir "$dir" "${RUNNER_TEMP}/verify"
          patterns=()
          for asset in "${assets[@]}"; do
            patterns+=(--pattern "$asset")
          done
          err="${RUNNER_TEMP}/download.err"
          if ! gh release download "v${VERSION}" --repo "$REPO" --dir "$dir" "${patterns[@]}" 2> "$err"; then
            cat "$err" >&2
            echo "::error title=release-download-failed::could not download the archives ${F} names from ${REPO} release v${VERSION}: $(head -n 1 "$err"). Nothing was pushed. gh release view v${VERSION} --repo ${REPO} shows whether the release exists and which assets it has; once it has them, run this job again: gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --failed. See ${DOCS}#release-download-failed"
            exit 1
          fi
          # Each check waits on the attestation API and Sigstore, so they run
          # side by side and each logs to its own file. One annotation reports
          # the failures, so a release whose archives all fail reads as one.
          pids=()
          for asset in "${assets[@]}"; do
            gh attestation verify "${dir}/${asset}" --repo "$REPO" --signer-workflow "$SIGNER" \
              > "${RUNNER_TEMP}/verify/${asset}.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          first=""
          for i in "${!assets[@]}"; do
            asset="${assets[$i]}"
            if wait "${pids[$i]}"; then
              echo "verified: ${asset}"
            else
              echo "::group::${asset} did not verify"
              cat "${RUNNER_TEMP}/verify/${asset}.log"
              echo "::endgroup::"
              failed=$((failed + 1))
              first="${first:-${asset}}"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error title=archive-not-attested::${failed} of ${#assets[@]} archives from ${REPO} v${VERSION}, the first ${first}, did not verify against an attestation signed by ${SIGNER}; each one's output is in its group above. Nothing was pushed. Output that finds no attestation means ${REPO}'s release.yml calls rust-release.yml without attest: true; output from the attestation API asks for this job again: gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --failed; an attestation that names other bytes means the archive changed after it was signed, so escalate. See ${DOCS}#archive-not-attested"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            echo "$(sha256sum "${dir}/${asset}" | awk '{print $1}') ${asset}" >> "${RUNNER_TEMP}/archives.sha256"
          done

      - name: Update formula
        run: |
          F="Formula/${FORMULA}.rb"
          sed -i -E "s#^( *url \"https://github\.com/[^/]+/[^/]+/releases/download/)v[^/]+/#\1v${VERSION}/#" "$F"
          # Each checksum is set on the line under its own archive's url, and
          # the pair is read back: a sed that matched nothing exits 0.
          while read -r sha asset; do
            sed -i "\#/releases/download/v${VERSION}/${asset}\"#{ n; s|sha256 \".*\"|sha256 \"${sha}\"| }" "$F"
            if ! grep -A1 -F "/releases/download/v${VERSION}/${asset}\"" "$F" | grep -qF "sha256 \"${sha}\""; then
              echo "::error title=checksum-not-pinned::${F} does not pin ${asset} to its checksum after the rewrite, because the line under that archive's url is not its sha256 line. Nothing was pushed. Put each url line directly above its sha256 line, through a pull request to dev, then run: gh workflow run update-formula.yml --repo ${GITHUB_REPOSITORY} -f formula=${FORMULA} -f version=${VERSION} -f repo=${REPO}. See ${DOCS}#checksum-not-pinned"
              exit 1
            fi
          done < "${RUNNER_TEMP}/archives.sha256"
          # A prebuilt formula gets no bottle, so a bottle block left from an
          # earlier form names bottles that will never exist.
          sed -i '/^  bottle do$/,/^  end$/d' "$F"
          # Collapse resulting double blank lines (capital D retains one blank)
          sed -i '/^$/N;/^\n$/D' "$F"
          git diff -- "$F"

      - name: Upload the bumped formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: Formula/${{ env.FORMULA }}.rb
          if-no-files-found: error

  # The checks tests.yml's lint job runs on a pull request, on the bumped
  # formula. A formula the sed left unstyled fails `brew style` here.
  lint:
    needs: bump
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-24.04-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-24.04-rubygems-

      - name: Download the bumped formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula

      - run: brew trust --tap brettdavies/tap

      - name: Tap syntax (brew style, readall, audit)
        run: |
          mapfile -t shell_files < <(find scripts -name '*.sh' -not -path 'scripts/release/*' -not -path scripts/check-workflow-concurrency.sh | sort)
          brew style Formula .github/workflows/*.yml "${shell_files[@]}"
          brew readall --aliases --os=all --arch=all brettdavies/tap
          brew audit --except=installed --tap=brettdavies/tap

      - name: Script tests (bats)
        run: |
          brew install --quiet bats-core
          bats tests

  # The install and test tests.yml's test job runs on a formula pull request,
  # on the same four platforms.
  test:
    needs: bump
    strategy:
      # Each leg is its own platform's evidence: a failed leg must not cancel
      # the others, so a platform-specific break stays distinguishable from a
      # formula-wide one.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Download the bumped formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula

      - run: brew trust --tap brettdavies/tap

      # `--build-from-source` installs from the archive the formula's `url`
      # names, so the archive is always the thing tested.
      - name: Install and test
        run: |
          set -euo pipefail
          formula="brettdavies/tap/${FORMULA}"
          brew fetch --formula --retry --build-from-source "$formula"
          brew install --formula --verbose --build-from-source "$formula"
          brew audit --formula --online --git --skip-style "$formula"
          brew linkage --test "$formula"
          brew test --verbose "$formula"

  land:
    needs: [bump, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # Every land job shares the group, so two bumps never push to `main` at
    # once.
    concurrency:
      group: publish-formula
      cancel-in-progress: false
    steps:
      # The checkout keeps this token for the push: a workflow token cannot
      # push past the `main` ruleset. The full history lets git-try-push
      # rebase onto a `main` that moved since the run started.
      - name: Check out with the release token
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CI_RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Set up git
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Download the bumped formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: ${{ runner.temp }}/formula

      # lint and every leg checked the bumped file against this run's
      # commit. If the branch's copy changed since then, git-try-push's
      # rebase would merge that edit into a file no job ran, or drop the bump
      # as already applied, so the run stops before it commits.
      - name: Commit the bump
        id: commit
        run: |
          set -euo pipefail
          F="Formula/${FORMULA}.rb"
          bumped="${RUNNER_TEMP}/formula/${FORMULA}.rb"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          git show "origin/${GITHUB_REF_NAME}:${F}" > "${RUNNER_TEMP}/now.rb" 2>/dev/null || : > "${RUNNER_TEMP}/now.rb"
          git show "${GITHUB_SHA}:${F}" > "${RUNNER_TEMP}/base.rb" 2>/dev/null || : > "${RUNNER_TEMP}/base.rb"
          if cmp -s "${RUNNER_TEMP}/now.rb" "$bumped"; then
            echo "::notice::${F} on ${GITHUB_REF_NAME} is already the bumped file; there is nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! cmp -s "${RUNNER_TEMP}/now.rb" "${RUNNER_TEMP}/base.rb"; then
            echo "::error title=formula-moved::${F} on ${GITHUB_REF_NAME} changed after this run's commit ${GITHUB_SHA:0:12}, so the file lint and the test legs checked is not the one a push would land. Nothing was pushed or dispatched. Bump again from the current ${GITHUB_REF_NAME}, which tests what it holds: gh workflow run update-formula.yml --repo ${GITHUB_REPOSITORY} --ref ${GITHUB_REF_NAME} -f formula=${FORMULA} -f version=${VERSION} -f repo=${REPO}. See ${DOCS}#formula-moved"
            exit 1
          fi
          cp "$bumped" "$F"
          {
            echo "chore(${FORMULA}): bump to v${VERSION}"
            echo
            echo "Release: https://github.com/${REPO}/releases/tag/v${VERSION}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${RUNNER_TEMP}/message.txt"
          git add "$F"
          git commit --quiet --author "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --file "${RUNNER_TEMP}/message.txt"
          git show --stat --format=fuller HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report the rehearsal
        if: env.DRY_RUN == 'true'
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = true ]; then
            would="push \"$(git log -1 --format=%s)\" to main"
          else
            would="push nothing, since main already pins v${VERSION},"
          fi
          echo "::notice title=dry-run::A dry run: a real run would ${would} and dispatch finalize-release to ${REPO} for v${VERSION}."

      - name: Push commits
        id: push
        if: env.DRY_RUN != 'true' && steps.commit.outputs.changed == 'true'
        uses: Homebrew/actions/git-try-push@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          branch: main

      # `bump` refused a repo the formula's `url` does not name, so REPO is
      # the repo the formula installs from. A name built from `${FORMULA}`
      # would differ (formula `agentnative`, repo `brettdavies/agentnative-cli`).
      # A push rebased onto an edit that landed in the moments before it can
      # leave main holding neither file, so main's copy is read again first.
      - name: Finalize source repo release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          F="Formula/${FORMULA}.rb"
          git fetch --quiet origin main
          if ! git show "origin/main:${F}" 2>/dev/null | cmp -s - "${RUNNER_TEMP}/formula/${FORMULA}.rb"; then
            echo "::error title=formula-moved::${F} on main is not the file lint and the test legs checked: an edit to it landed after this run read main. Nothing was dispatched, and the source release is not marked latest. Bump again from main, which tests what main holds: gh workflow run update-formula.yml --repo ${GITHUB_REPOSITORY} --ref main -f formula=${FORMULA} -f version=${VERSION} -f repo=${REPO}. See ${DOCS}#formula-moved"
            exit 1
          fi
          err="${RUNNER_TEMP}/dispatch.err"
          if ! gh api "repos/${REPO}/dispatches" \
            --method POST \
            -f event_type=finalize-release \
            -f "client_payload[tag]=v${VERSION}" 2> "$err"; then
            cat "$err" >&2
            echo "::error title=finalize-dispatch-failed::Formula/${FORMULA}.rb pins v${VERSION} on main, which this run pushed or found there, and the finalize-release dispatch to ${REPO} failed: $(head -n 1 "$err"). The source release is published and not yet marked latest. A 403 or 404 means CI_RELEASE_TOKEN cannot reach ${REPO}, which a person grants; otherwise send the dispatch again, which pushes nothing new: gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --failed. See ${DOCS}#finalize-dispatch-failed"
            exit 1
          fi

      # The checkout and the push are actions that print git's output and no
      # code, so this step names the stop and whether `main` moved.
      - name: Report a failed landing
        if: failure() && (steps.checkout.outcome == 'failure' || steps.push.outcome == 'failure')
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
        run: |
          if [ "$CHECKOUT" = failure ]; then
            echo "::error title=release-token-rejected::the checkout with CI_RELEASE_TOKEN failed, so the token is expired, revoked, or cannot read ${GITHUB_REPOSITORY}. Nothing was pushed. A person rotates the secret; then run this job again: gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --failed. See ${DOCS}#release-token-rejected"
          else
            echo "::error title=push-failed::git-try-push did not push the bump to main within its retries; its output above says why. main did not move, and the source release is not finalized. A 403 means a person rotates CI_RELEASE_TOKEN, and a ruleset refusal means the token lost its bypass; otherwise run this job again: gh run rerun ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --failed. See ${DOCS}#push-failed"
          fi
