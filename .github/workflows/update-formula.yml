name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name (e.g., xurl-rs)"
        required: true
      version:
        description: "Version without v prefix (e.g., 1.0.4)"
        required: true
      repo:
        description: "GitHub repo (e.g., brettdavies/xurl-rs)"
        required: true

concurrency:
  group: update-formula
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORMULA: ${{ github.event.client_payload.formula || inputs.formula }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      REPO: ${{ github.event.client_payload.repo || inputs.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CI_RELEASE_TOKEN }}

      - name: Validate inputs
        run: |
          # 1. Formula allowlist (primary security gate)
          if [[ ! "$FORMULA" =~ ^(xurl-rs|bird|agentnative)$ ]]; then
            echo "::error::Formula not in allowlist: ${FORMULA}"
            exit 1
          fi

          # 2. Version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${VERSION} (expected X.Y.Z)"
            exit 1
          fi

          # 3. Repo regex (reject path traversal and special characters)
          if [[ ! "$REPO" =~ ^brettdavies/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid repo format: ${REPO}"
            exit 1
          fi

          # 4. Formula file exists (defense-in-depth)
          if [[ ! -f "Formula/${FORMULA}.rb" ]]; then
            echo "::error::Formula file not found: Formula/${FORMULA}.rb"
            exit 1
          fi

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      # A formula installs either by building the tagged source tarball or
      # from the prebuilt archives its release publishes; its `url` lines say
      # which. The two are bumped differently below.
      - name: Detect how the formula installs
        run: |
          if grep -qE '^ *url "https://github\.com/[^/]+/[^/]+/releases/download/' "Formula/${FORMULA}.rb"; then
            echo "PREBUILT=true" >> "$GITHUB_ENV"
          else
            echo "PREBUILT=false" >> "$GITHUB_ENV"
          fi

      - name: Download tarball and compute SHA256
        if: env.PREBUILT != 'true'
        run: |
          TARBALL_URL="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"
          curl --fail-with-body -sL -o tarball.tar.gz "$TARBALL_URL"
          file tarball.tar.gz | grep -q 'gzip' || { echo "::error::Downloaded file is not a gzip archive"; exit 1; }
          SHA=$(sha256sum tarball.tar.gz | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          rm tarball.tar.gz

      # Each archive a prebuilt formula names is checked against the
      # attestation the source repo's release made for it, and only then is its
      # checksum computed, from the verified file. A release without an
      # attestation stops the bump here.
      - name: Verify release archives and compute SHA256
        if: env.PREBUILT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The reusable workflow the source repos release through signs the
          # archives, so it is the signer and not the source repo's own
          # release.yml.
          SIGNER: brettdavies/.github/.github/workflows/rust-release.yml
        run: |
          F="Formula/${FORMULA}.rb"
          mapfile -t assets < <(sed -nE \
            's#^ *url "https://github\.com/[^/]+/[^/]+/releases/download/v[^/]+/([^"]+)"#\1#p' "$F")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::${F} names no release archive"
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/archives"
          for asset in "${assets[@]}"; do
            gh release download "v${VERSION}" --repo "$REPO" --pattern "$asset" --dir "${RUNNER_TEMP}/archives"
            gh attestation verify "${RUNNER_TEMP}/archives/${asset}" --repo "$REPO" --signer-workflow "$SIGNER"
            echo "$(sha256sum "${RUNNER_TEMP}/archives/${asset}" | awk '{print $1}') ${asset}" \
              >> "${RUNNER_TEMP}/archives.sha256"
          done

      - name: Update formula (source tarball)
        if: env.PREBUILT != 'true'
        run: |
          F="Formula/${FORMULA}.rb"
          sed -i "s|url \"https://github.com/${REPO}/archive/refs/tags/v.*\.tar\.gz\"|url \"https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz\"|" "$F"
          sed -i '/^  url /{ n; s|sha256 ".*"|sha256 "'"${SHA256}"'"| }' "$F"

      - name: Update formula (prebuilt archives)
        if: env.PREBUILT == 'true'
        run: |
          F="Formula/${FORMULA}.rb"
          sed -i -E "s#^( *url \"https://github\.com/[^/]+/[^/]+/releases/download/)v[^/]+/#\1v${VERSION}/#" "$F"
          # Each checksum is set on the line under its own archive's url, and
          # the pair is read back: a sed that matched nothing exits 0.
          while read -r sha asset; do
            sed -i "\#/releases/download/v${VERSION}/${asset}\"#{ n; s|sha256 \".*\"|sha256 \"${sha}\"| }" "$F"
            if ! grep -A1 -F "/releases/download/v${VERSION}/${asset}\"" "$F" | grep -qF "sha256 \"${sha}\""; then
              echo "::error::${F} does not pin ${asset} to its checksum"
              exit 1
            fi
          done < "${RUNNER_TEMP}/archives.sha256"

      - name: Remove the stale bottle block
        run: |
          F="Formula/${FORMULA}.rb"
          # Remove stale bottle block — new bottles will be built by CI
          sed -i '/^  bottle do$/,/^  end$/d' "$F"
          # Collapse resulting double blank lines (capital D retains one blank)
          sed -i '/^$/N;/^\n$/D' "$F"

      - name: Auto-fix formula style
        run: brew style --fix --formula "${FORMULA}"

      - name: Audit formula
        run: brew audit --formula "${FORMULA}"

      - name: Create PR with formula update
        env:
          CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${CI_RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          git add "Formula/${FORMULA}.rb"
          git diff --cached --quiet && echo "No changes" && exit 0
          BRANCH="update/${FORMULA}/v${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "chore(${FORMULA}): bump to v${VERSION}"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "chore(${FORMULA}): bump to v${VERSION}" \
            --body "Automated formula update for ${FORMULA} v${VERSION}." \
            --base main \
            --head "$BRANCH"
