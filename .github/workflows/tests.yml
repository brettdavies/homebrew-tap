name: CI

on:
  push:
    branches:
      - main
  pull_request:

# The group key leads with a literal token naming the workflow that owns it. A
# key built only from context (`${{ github.workflow }}`) is one a called
# reusable also produces, because `github.workflow` resolves to the caller
# inside a called workflow; both land in one group and the reusable's queue
# cancels the run that called it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-24.04-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-24.04-rubygems-

      - run: brew test-bot --only-cleanup-before

      # `brew doctor` (invoked by `--only-setup`) now warns about untrusted
      # third-party taps (Homebrew/brew#22470). Under `HOMEBREW_DEVELOPER`,
      # which test-bot sets, that warning is fatal. Trusting at the tap
      # level covers every formula in this tap, present and future.
      - run: brew trust --tap brettdavies/tap

      # `brew doctor` (invoked by `--only-setup`) requires bubblewrap on
      # Linux to enable the rootless sandbox; without it the doctor step
      # exits non-zero. GitHub-hosted Ubuntu runners don't ship bubblewrap
      # by default. Refs: Homebrew/brew §sandbox.rb.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - run: brew test-bot --only-setup

      # `brew test-bot --only-tap-syntax` runs `brew style` over every *.sh in
      # the tap. scripts/release/ and scripts/check-workflow-concurrency.sh
      # are vendored verbatim from the github-repo-setup skill and follow that
      # skill's shfmt/shellcheck profile, which Homebrew's shell style
      # rewrites (`then`/`do` on their own lines, braces on every expansion).
      # The three tap-syntax phases therefore run here with an explicit style
      # target list, and the vendored scripts are checked with their own
      # linters in the next step. scripts/hooks/pre-push mirrors both.
      - name: Tap syntax (brew style, readall, audit)
        run: |
          mapfile -t shell_files < <(find scripts -name '*.sh' -not -path 'scripts/release/*' -not -path scripts/check-workflow-concurrency.sh | sort)
          brew style Formula .github/workflows/*.yml "${shell_files[@]}"
          brew readall --aliases --os=all --arch=all brettdavies/tap
          brew audit --except=installed --tap=brettdavies/tap

      - name: Vendored scripts (shfmt, shellcheck)
        run: |
          brew install --quiet shfmt shellcheck
          shfmt -i 2 -ci -bn -d scripts/release scripts/check-workflow-concurrency.sh
          shellcheck --severity=warning scripts/release/*.sh scripts/check-workflow-concurrency.sh

      - name: Concurrency-group namespacing
        run: ./scripts/check-workflow-concurrency.sh

      - name: Script tests (bats)
        run: |
          brew install --quiet bats-core
          bats tests

  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Comma-separated, tap-qualified testing formulae (e.g.
      # "brettdavies/tap/xurl-rs,brettdavies/tap/bird"). `brew test-bot
      # --testing-formulae=` is a comma_array (see
      # Library/Homebrew/dev-cmd/test-bot.rb). Excludes any formula
      # pre-seeded with the v0.0.0 placeholder: its tarball or archives do not
      # exist yet, so the fetch would 404. See the solutions
      # note: integration-issues/homebrew-tap-automated-formula-updates-via-dispatch.md
      testing_formulae: ${{ steps.check.outputs.testing_formulae }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect testable formulas (exclude v0.0.0 pre-seeds)
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Formula backport PRs (scripts/sync-formulas-to-dev.sh) sync
            // formula text update-formula.yml already tested and landed on
            // main, so report no testing formulae and let the test job's `if`
            // skip. Scoped tightly: only `chore/sync-dev*` heads targeting
            // `dev` (the script's own branch names), so human formula edits
            // are still tested.
            const pr = context.payload.pull_request;
            if (pr.base.ref === 'dev' && pr.head.ref.startsWith('chore/sync-dev')) {
              core.info(`Backport PR (${pr.head.ref} -> ${pr.base.ref}); skipping the formula tests.`);
              core.setOutput('testing_formulae', '');
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const formulaFiles = files
              .filter(f => f.filename.startsWith('Formula/') && f.filename.endsWith('.rb'))
              .filter(f => f.status !== 'removed');
            core.info(`Changed formula files: ${formulaFiles.map(f => f.filename).join(', ') || '(none)'}`);

            // Tap prefix for `brew test-bot --testing-formulae`. Hardcoded to
            // this tap's slug — the workflow only runs in this repo.
            const tapPrefix = 'brettdavies/tap/';
            // Pre-seed marker: a formula created with the v0.0.0 placeholder
            // names a release that does not exist yet, as the tag tarball of
            // a source-built formula or the archives of a prebuilt one.
            // Matches only v0.0.0, so bumps to real versions are tested.
            // tests/detect-preseed.bats runs this regex from this one line.
            const preseedRegex = /url\s+"https:\/\/github\.com\/[^"]+\/(?:archive\/refs\/tags\/v0\.0\.0\.tar\.gz|releases\/download\/v0\.0\.0\/[^"]+)"/;

            const headSha = context.payload.pull_request.head.sha;
            const headRepo = context.payload.pull_request.head.repo;
            // `head.repo` is null when the fork was deleted; fall back to the
            // base repo so the API call still resolves (the PR won't be
            // mergeable anyway, but we shouldn't crash).
            const owner = headRepo ? headRepo.owner.login : context.repo.owner;
            const repo = headRepo ? headRepo.name : context.repo.repo;

            const testable = [];
            for (const f of formulaFiles) {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: f.filename, ref: headSha,
              });
              const content = Buffer.from(data.content, data.encoding).toString('utf8');
              const name = f.filename.replace(/^Formula\//, '').replace(/\.rb$/, '');
              if (preseedRegex.test(content)) {
                core.info(`Skipping ${name}: v0.0.0 pre-seed placeholder (no release yet).`);
                continue;
              }
              testable.push(`${tapPrefix}${name}`);
            }

            // Comma-separated per `brew test-bot --testing-formulae=` parser.
            const list = testable.join(',');
            core.setOutput('testing_formulae', list);
            core.info(`Testing formulae: ${list || '(none — test job will be skipped)'}`);

  # The same install and test update-formula.yml's test job runs on a bump,
  # for a pull request that edits a formula by hand.
  test:
    if: needs.detect.outputs.testing_formulae != ''
    needs: [lint, detect]
    strategy:
      # Each leg is its own platform's evidence: a failed leg must not cancel
      # the others, so a platform-specific break stays distinguishable from a
      # formula-wide one.
      fail-fast: false
      # Every Tier 1 configuration Homebrew names, and only those
      # (https://docs.brew.sh/Support-Tiers): Apple Silicon macOS 27/26/15
      # plus Linux on arm64 and x86_64. macOS 27 has no GA runner yet; add a
      # leg once a `macos-27` label reaches GA.
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew trust --tap brettdavies/tap

      # Every formula in the tap installs its release's prebuilt archives, and
      # the tap publishes no bottles. scripts/formula-form.sh is the one
      # definition of the form.
      - name: Refuse a source-built formula
        env:
          TESTING_FORMULAE: ${{ needs.detect.outputs.testing_formulae }}
        run: |
          set -euo pipefail
          IFS=',' read -ra formulae <<< "$TESTING_FORMULAE"
          for formula in "${formulae[@]}"; do
            file="Formula/${formula##*/}.rb"
            if [ "$(scripts/formula-form.sh "$file")" != prebuilt ]; then
              echo "::error file=${file},title=source-built-formula::${file} builds its tagged source tarball, and this tap tests and publishes only a formula that installs the prebuilt archives its release publishes. Convert it to the prebuilt form (homebrew-tap-publish's formula-prebuilt.rb). See https://github.com/${GITHUB_REPOSITORY}/blob/main/RELEASES.md#source-built-formula"
              exit 1
            fi
          done

      # `--build-from-source` installs from the archive the formula's `url`
      # names, so the archive is always the thing tested.
      - name: Install and test
        env:
          TESTING_FORMULAE: ${{ needs.detect.outputs.testing_formulae }}
        run: |
          set -euo pipefail
          IFS=',' read -ra formulae <<< "$TESTING_FORMULAE"
          for formula in "${formulae[@]}"; do
            brew fetch --formula --retry --build-from-source "$formula"
            brew install --formula --verbose --build-from-source "$formula"
            brew audit --formula --online --git --skip-style "$formula"
            brew linkage --test "$formula"
            brew test --verbose "$formula"
          done
